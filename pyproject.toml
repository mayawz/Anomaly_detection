[project]
name = "agentic-ai-for-anomaly-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maya wz", email = "mayawangz@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "combo>=0.1.3",
    "google-genai>=3.6.1",
    "llvmlite<0.46 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "matplotlib>=3.11.2",
    "numpy>=1.26.4",
    "numpy<2 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "pandas>=3.0.6",
    "pyod>=3.6.8",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "streamlit>=1.60.0",
    "tensorflow==2.16.2 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "tensorflow>=2.16 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "torch==2.2.2 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "torch>=2.2 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "kagglehub[pandas-datasets]>=1.0.3",
    "sweetviz>=2.3.3",
    "optuna>=5.1.0",
    "shap>=0.49.1",
]

[project.scripts]
agentic-ai-for-anomaly-detection = "src:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Install the importable package as `src` (the folder ./src itself)
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
